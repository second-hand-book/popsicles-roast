<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>POPSICLE ROAST</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      background-color: #ffffff;
      color: #111111;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-x: hidden;
    }

    /* 首頁區域：作為絕對定位參考點 */
    .hero-section {
      width: 100%;
      min-height: 100vh;
      position: relative; /* 關鍵：讓評語欄可以固定定位 */
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    header {
      text-align: center;
      padding-top: 3.5rem;
      width: 100%;
    }

    header h1 {
      font-size: 3.8rem;
      letter-spacing: 12px;
      font-weight: 800;
      color: #111111;
      text-transform: uppercase;
      line-height: 1;
    }

    /* 🔴 紅色旋轉舞台：再加大 margin-top */
    .stage {
      width: 100%;
      height: 320px;
      margin-top: 7.5rem; /* 已調整為 7.5rem */
      perspective: 1000px;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: grab;
      touch-action: pan-y;
    }

    .stage:active {
      cursor: grabbing;
    }

    .carousel {
      width: var(--card-w, 190px);
      height: var(--card-h, 253px);
      position: relative;
      transform-style: preserve-3d;
    }

    .card {
      position: absolute;
      width: var(--card-w, 190px);
      height: var(--card-h, 253px);
      border-radius: 0;
      overflow: visible;
      background: transparent;
      transition: opacity 0.3s, transform 0.3s;
      opacity: 0.15;
    }

    .card img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      pointer-events: none;
      background-color: transparent;
      filter: drop-shadow(0 8px 16px rgba(0, 0, 0, 0.12));
    }

    .card.active {
      opacity: 1;
    }

    .card.active img {
      filter: drop-shadow(0 12px 24px rgba(0, 0, 0, 0.2));
    }

    /* 🔵 藍色評語欄：固定位置不浮動 */
    .review-panel {
      position: absolute; /* 鎖定定位 */
      bottom: 2.5rem;     /* 固定死在距離底部 2.5rem 的地方 */
      width: 90%;
      max-width: 500px;
      padding: 1rem;
      text-align: center;
      min-height: 120px;
    }

    .ice-title {
      font-size: 1.3rem;
      font-weight: 700;
      color: #111111;
      margin-bottom: 0.6rem;
      letter-spacing: 1px;
    }

    .rating-container {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-bottom: 0.8rem;
    }

    .stars-outer {
      position: relative;
      display: inline-block;
      font-size: 1.2rem;
      letter-spacing: 3px;
      color: #e2e8f0;
      line-height: 1;
    }

    .stars-inner {
      position: absolute;
      top: 0;
      left: 0;
      white-space: nowrap;
      overflow: hidden;
      color: #111111;
      line-height: 1;
    }

    .score-num {
      font-size: 1.05rem;
      color: #111111;
      font-weight: 600;
      letter-spacing: 1px;
      margin-left: 4px;
    }

    .review-text {
      color: #333333;
      font-size: 0.95rem;
      line-height: 1.6;
      font-weight: 400;
    }

    .gallery-section {
      width: 100%;
      max-width: 800px;
      margin-top: 15vh;
      padding: 0 1.5rem 6rem 1.5rem;
      text-align: center;
    }

    .gallery-title {
      font-size: 0.9rem;
      letter-spacing: 4px;
      font-weight: 700;
      color: #888888;
      text-transform: uppercase;
      margin-bottom: 2rem;
    }

    .thumbnail-gallery {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(65px, 1fr));
      gap: 14px;
    }

    .thumb-card {
      aspect-ratio: 3/4;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 6px;
      background-color: transparent;
      transition: transform 0.25s cubic-bezier(0.2, 0, 0, 1);
    }

    .thumb-card:hover {
      transform: scale(1.18) translateY(-4px);
      z-index: 10;
    }

    .thumb-card img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.08));
    }

    /* 📱 手機微調 */
    @media (max-width: 768px) {
      .hero-section {
        min-height: 100dvh;
      }

      header {
        padding-top: clamp(2rem, 5vh, 3.5rem);
      }

      header h1 {
        font-size: clamp(2.2rem, 8vw, 3.8rem);
        letter-spacing: clamp(6px, 2vw, 12px);
      }

      .stage {
        height: 280px;
        margin-top: 6.5rem; /* 手機版同步加大間距 */
        perspective: 800px;
      }

      .review-panel {
        bottom: 1.5rem;
        padding: 0.8rem 1rem;
      }

      .ice-title {
        font-size: clamp(1.1rem, 4.5vw, 1.3rem);
        margin-bottom: 0.4rem;
      }

      .rating-container {
        margin-bottom: 0.6rem;
      }

      .stars-outer {
        font-size: clamp(1rem, 4vw, 1.2rem);
      }

      .score-num {
        font-size: clamp(0.95rem, 3.8vw, 1.05rem);
      }

      .review-text {
        font-size: clamp(0.88rem, 3.5vw, 0.95rem);
        line-height: 1.5;
      }

      .gallery-section {
        margin-top: 4vh;
        padding: 0 1.2rem 5rem 1.2rem;
      }

      .gallery-title {
        font-size: 0.85rem;
        margin-bottom: 1.5rem;
      }

      .thumbnail-gallery {
        grid-template-columns: repeat(auto-fill, minmax(50px, 1fr));
        gap: 10px;
      }

      .thumb-card {
        padding: 4px;
      }
    }
  </style>
</head>
<body>

  <div class="hero-section">
    <header>
      <h1>POPSICLE ROAST</h1>
    </header>

    <div class="stage" id="stage">
      <div class="carousel" id="carousel"></div>
    </div>

    <div class="review-panel">
      <div class="ice-title" id="iceTitle"></div>
      
      <div class="rating-container">
        <div class="stars-outer">
          ★★★★★
          <div class="stars-inner" id="starsInner">★★★★★</div>
        </div>
        <span class="score-num" id="scoreNum"></span>
      </div>

      <div class="review-text" id="reviewText"></div>
    </div>
  </div>

  <div class="gallery-section">
    <div class="gallery-title">ALL POPSICLES</div>
    <div class="thumbnail-gallery" id="thumbnailGallery"></div>
  </div>

  <script>
    let popsicles = [
      { name: "白醋涼麵風味雪糕", img: "image/1.png", score: 1.2, review: "這太鹹了…吃一整支舌頭會澀" },
      { name: "開心果金絲脆摩納餅", img: "image/2.png", score: 0.5, review: "不！！！不好吃！沒什麼開心果味 裡面也不算脆 大家不要買！" },
      { name: "Baiocchi", img: "image/3.png", score: 4.8, review: "開心果推薦這個餅乾" },
      { name: "番茄糖葫蘆冰棒", img: "image/4.png", score: 4.3, review: "好吃到想囤積XD" },
      { name: "JULIA LIN 香菜牛奶花生雪糕", img: "image/5.png", score: 2.3, review: "雅芳加新鮮香菜在冰棒裡真的有合法嗎？" },
      { name: "莊記綠豆鑽冰棒", img: "image/6.png", score: 4.3, review: "好吃欸" },
      { name: "極濃義式開心果雪糕", img: "image/7.png", score: 0, review: "None" },
      { name: "紅心芭樂茉綠奶蓋雪糕", img: "image/8.png", score: 4.3, review: "紅心芭樂讚🍀🍀🍀 超讚！！！！" },
      { name: "牧場直送4.0玉米牛奶雪糕", img: "image/9.png", score: 4.6, review: "None" },
      { name: "丸永製菓檸檬蛋糕風味冰棒", img: "image/10.png", score: 3.8, review: "好吃～但蠻甜的😳 而且很小😂" },
      { name: "牧場直送4.0草莓牛奶雪糕", img: "image/11.png", score: 4.3, review: "牧場系列我覺得草莓很好吃" },
      { name: "紫薯香草風味奶蓋雪糕", img: "image/12.png", score: 4.1, review: "香香甜甜 裡面的地瓜圓意外的加分" },
      { name: "Binggrae起司夾心冰淇淋蛋糕", img: "image/13.png", score: 3.9, review: "是鹹鹹的起司，但又甜甜奶奶的，前三口好吃，後面有點膩，但整體來說還是蠻特別的，可淺嚐，分食感覺比較適合" },
      { name: "Baki Crunky 脆皮巧克力雪糕", img: "image/14.png", score: 3.8, review: "頗甜，但裡面真的會突然有巨大巧克力塊，確實頗脆。是爽冰，不怕甜人可嘗試，怕甜人小心。" }
    ];

    function analyzeImageHue(imgUrl) {
      return new Promise((resolve) => {
        const img = new Image();
        img.crossOrigin = "Anonymous";
        img.src = imgUrl;

        img.onload = () => {
          const canvas = document.createElement("canvas");
          const ctx = canvas.getContext("2d");
          canvas.width = 30;
          canvas.height = 30;

          try {
            ctx.drawImage(img, 0, 0, 30, 30);
            const data = ctx.getImageData(0, 0, 30, 30).data;
            let rSum = 0, gSum = 0, bSum = 0, count = 0;

            for (let i = 0; i < data.length; i += 4) {
              if (data[i + 3] > 30) {
                rSum += data[i];
                gSum += data[i + 1];
                bSum += data[i + 2];
                count++;
              }
            }

            if (count === 0) return resolve(0);

            const r = rSum / count / 255;
            const g = gSum / count / 255;
            const b = bSum / count / 255;

            const max = Math.max(r, g, b), min = Math.min(r, g, b);
            let h = 0;

            if (max !== min) {
              const d = max - min;
              switch (max) {
                case r: h = (g - b) / d + (g < b ? 6 : 0); break;
                case g: h = (b - r) / d + 2; break;
                case b: h = (r - g) / d + 4; break;
              }
              h /= 6;
            }
            resolve(Math.round(h * 360));
          } catch (e) {
            resolve(0);
          }
        };

        img.onerror = () => resolve(0);
      });
    }

    const carousel = document.getElementById("carousel");
    const stage = document.getElementById("stage");
    const gallery = document.getElementById("thumbnailGallery");
    const iceTitleEl = document.getElementById("iceTitle");
    const starsInnerEl = document.getElementById("starsInner");
    const scoreNumEl = document.getElementById("scoreNum");
    const reviewTextEl = document.getElementById("reviewText");

    let total, angleStep, radius, cards;
    let currentAngle = 0, startX = 0, isDragging = false, velocity = 0, lastX = 0, animationFrame = null;

    function renderDOM() {
      carousel.innerHTML = "";
      gallery.innerHTML = "";
      total = popsicles.length;
      angleStep = 360 / total;

      const isMobile = window.innerWidth <= 768;
      
      const cardWidth = isMobile ? 160 : 190;
      const cardHeight = isMobile ? 213 : 253;

      document.documentElement.style.setProperty('--card-w', `${cardWidth}px`);
      document.documentElement.style.setProperty('--card-h', `${cardHeight}px`);

      const computedRadius = Math.round((cardWidth / 2) / Math.tan(Math.PI / total)) + (isMobile ? 10 : 20);
      radius = Math.max(isMobile ? 200 : 320, computedRadius);

      popsicles.forEach((item, index) => {
        const card = document.createElement("div");
        card.className = "card";
        const cardAngle = angleStep * index;
        card.style.transform = `rotateY(${cardAngle}deg) translateZ(${radius}px)`;
        card.innerHTML = `<img src="${item.img}" alt="${item.name}">`;
        carousel.appendChild(card);

        const thumb = document.createElement("div");
        thumb.className = "thumb-card";
        thumb.innerHTML = `<img src="${item.img}" alt="${item.name}">`;
        
        thumb.onclick = () => {
          let targetAngle = -index * angleStep;
          let diff = (targetAngle - currentAngle) % 360;
          if (diff > 180) diff -= 360;
          if (diff < -180) diff += 360;
          
          cancelAnimationFrame(animationFrame);
          animateSnap(currentAngle + diff);
          
          window.scrollTo({ top: 0, behavior: 'smooth' });
        };
        gallery.appendChild(thumb);
      });

      cards = document.querySelectorAll(".card");
      render();
    }

    async function loadColorsAndSort() {
      const colorPromises = popsicles.map(async (item) => {
        item.hue = await analyzeImageHue(item.img);
      });
      
      await Promise.all(colorPromises);
      popsicles.sort((a, b) => a.hue - b.hue);
      renderDOM();
    }

    function updateActiveCard() {
      if (!cards || cards.length === 0) return;
      let normalizedAngle = (-currentAngle % 360 + 360) % 360;
      let activeIndex = Math.round(normalizedAngle / angleStep) % total;

      cards.forEach((card, idx) => {
        card.classList.toggle("active", idx === activeIndex);
      });

      const currentScore = popsicles[activeIndex].score;
      iceTitleEl.textContent = popsicles[activeIndex].name;
      starsInnerEl.style.width = `${(currentScore / 5.0) * 100}%`;
      scoreNumEl.textContent = `(${currentScore.toFixed(1)} / 5.0)`;
      reviewTextEl.textContent = popsicles[activeIndex].review;
    }

    function render() {
      carousel.style.transform = `rotateY(${currentAngle}deg)`;
      updateActiveCard();
    }

    function onPointerDown(e) {
      isDragging = true;
      startX = e.clientX || (e.touches && e.touches[0].clientX);
      lastX = startX;
      velocity = 0;
      cancelAnimationFrame(animationFrame);
    }

    function onPointerMove(e) {
      if (!isDragging) return;
      const x = e.clientX || (e.touches && e.touches[0].clientX);
      const deltaX = x - lastX;
      currentAngle += deltaX * 0.35;
      velocity = deltaX * 0.35;
      lastX = x;
      render();
    }

    function onPointerUp() {
      if (!isDragging) return;
      isDragging = false;
      applyInertia();
    }

    function applyInertia() {
      if (Math.abs(velocity) > 0.05) {
        currentAngle += velocity;
        velocity *= 0.93;
        render();
        animationFrame = requestAnimationFrame(applyInertia);
      } else {
        snapToNearest();
      }
    }

    function animateSnap(target) {
      const diff = target - currentAngle;
      if (Math.abs(diff) > 0.1) {
        currentAngle += diff * 0.1;
        render();
        animationFrame = requestAnimationFrame(() => animateSnap(target));
      } else {
        currentAngle = target;
        render();
      }
    }

    function snapToNearest() {
      const targetAngle = Math.round(currentAngle / angleStep) * angleStep;
      animateSnap(targetAngle);
    }

    stage.addEventListener("mousedown", onPointerDown);
    window.addEventListener("mousemove", onPointerMove);
    window.addEventListener("mouseup", onPointerUp);

    stage.addEventListener("touchstart", onPointerDown, { passive: true });
    window.addEventListener("touchmove", onPointerMove, { passive: true });
    window.addEventListener("touchend", onPointerUp);

    window.addEventListener("resize", () => {
      clearTimeout(window.resizeTimer);
      window.resizeTimer = setTimeout(renderDOM, 200);
    });

    renderDOM();
    loadColorsAndSort();
  </script>
</body>
</html>
