<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>POPSICLE ROAST</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent; /* 移除手機點擊藍色陰影 */
    }

    body {
      background-color: #ffffff;
      color: #111111;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-x: hidden;
    }

    .hero-section {
      width: 100%;
      min-height: 100vh;
      min-height: 100dvh; /* 相容手機動態 Safari 網址列高度 */
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 1.5rem;
    }

    header {
      text-align: center;
      padding-top: clamp(2rem, 5vh, 3.5rem);
      width: 100%;
    }

    header h1 {
      font-size: clamp(2.2rem, 8vw, 3.8rem); /* 手機端自動等比例縮小 */
      letter-spacing: clamp(6px, 2vw, 12px);
      font-weight: 800;
      color: #111111;
      text-transform: uppercase;
      line-height: 1;
    }

    /* 3D 環形舞台：防止手勢與頁面上下滾動衝突 */
    .stage {
      width: 100%;
      height: 320px;
      perspective: 800px;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: grab;
      touch-action: pan-y; /* 允許垂直滾動，但橫滑專屬於 3D 轉盤 */
    }

    .stage:active {
      cursor: grabbing;
    }

    .carousel {
      width: var(--card-w, 225px);
      height: var(--card-h, 300px);
      position: relative;
      transform-style: preserve-3d;
    }

    .card {
      position: absolute;
      width: var(--card-w, 225px);
      height: var(--card-h, 300px);
      border-radius: 0;
      overflow: visible;
      background: transparent;
      transition: opacity 0.3s, transform 0.3s;
      opacity: 0.15;
    }

    .card img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      pointer-events: none;
      background-color: transparent;
      filter: drop-shadow(0 8px 16px rgba(0, 0, 0, 0.12));
    }

    .card.active {
      opacity: 1;
    }

    .card.active img {
      filter: drop-shadow(0 12px 24px rgba(0, 0, 0, 0.2));
    }

    /* 銳評區域 */
    .review-panel {
      width: 90%;
      max-width: 500px;
      padding: 0.8rem 1rem;
      text-align: center;
      min-height: 130px;
    }

    .ice-title {
      font-size: clamp(1.1rem, 4.5vw, 1.3rem);
      font-weight: 700;
      color: #111111;
      margin-bottom: 0.4rem;
      letter-spacing: 1px;
    }

    .rating-container {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-bottom: 0.6rem;
    }

    .stars-outer {
      position: relative;
      display: inline-block;
      font-size: clamp(1rem, 4vw, 1.2rem);
      letter-spacing: 3px;
      color: #e2e8f0;
      line-height: 1;
    }

    .stars-inner {
      position: absolute;
      top: 0;
      left: 0;
      white-space: nowrap;
      overflow: hidden;
      color: #111111;
      line-height: 1;
    }

    .score-num {
      font-size: clamp(0.95rem, 3.8vw, 1.05rem);
      color: #111111;
      font-weight: 600;
      letter-spacing: 1px;
      margin-left: 4px;
    }

    .review-text {
      color: #333333;
      font-size: clamp(0.88rem, 3.5vw, 0.95rem);
      line-height: 1.5;
      font-weight: 400;
    }

    /* 下滑區域：縮圖牆 */
    .gallery-section {
      width: 100%;
      max-width: 800px;
      margin-top: 8vh;
      padding: 0 1.2rem 5rem 1.2rem;
      text-align: center;
    }

    .gallery-title {
      font-size: 0.85rem;
      letter-spacing: 4px;
      font-weight: 700;
      color: #888888;
      text-transform: uppercase;
      margin-bottom: 1.5rem;
    }

    .thumbnail-gallery {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(58px, 1fr));
      gap: 12px;
    }

    .thumb-card {
      aspect-ratio: 3/4;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 4px;
      background-color: transparent;
      transition: transform 0.2s ease;
    }

    .thumb-card:active {
      transform: scale(0.92); /* 手機觸控反饋 */
    }

    .thumb-card img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.08));
    }

    /* 針對手機小螢幕 (< 480px) 的專屬微調 */
    @media (max-width: 480px) {
      .stage {
        height: 280px;
      }
      .gallery-section {
        margin-top: 4vh;
      }
      .thumbnail-gallery {
        grid-template-columns: repeat(auto-fill, minmax(50px, 1fr));
        gap: 10px;
      }
    }
  </style>
</head>
<body>

  <div class="hero-section">
    <header>
      <h1>POPSICLE ROAST</h1>
    </header>

    <div class="stage" id="stage">
      <div class="carousel" id="carousel"></div>
    </div>

    <div class="review-panel">
      <div class="ice-title" id="iceTitle"></div>
      
      <div class="rating-container">
        <div class="stars-outer">
          ★★★★★
          <div class="stars-inner" id="starsInner">★★★★★</div>
        </div>
        <span class="score-num" id="scoreNum"></span>
      </div>

      <div class="review-text" id="reviewText"></div>
    </div>
  </div>

  <div class="gallery-section">
    <div class="gallery-title">ALL POPSICLES</div>
    <div class="thumbnail-gallery" id="thumbnailGallery"></div>
  </div>

  <script>
    let popsicles = [
      { name: "白醋涼麵風味雪糕", img: "image/1.png", score: 1.2, review: "這太鹹了…吃一整支舌頭會澀" },
      { name: "開心果金絲脆摩納餅", img: "image/2.png", score: 0.5, review: "不！！！不好吃！沒什麼開心果味 裡面也不算脆 大家不要買！" },
      { name: "Baiocchi", img: "image/3.png", score: 4.8, review: "開心果推薦這個餅乾" },
      { name: "番茄糖葫蘆冰棒", img: "image/4.png", score: 4.3, review: "好吃到想囤積XD" },
      { name: "JULIA LIN 香菜牛奶花生雪糕", img: "image/5.png", score: 2.3, review: "雅芳加新鮮香菜在冰棒裡真的有合法嗎？" },
      { name: "莊記綠豆鑽冰棒", img: "image/6.png", score: 4.3, review: "好吃欸" },
      { name: "極濃義式開心果雪糕", img: "image/7.png", score: 0, review: "None" },
      { name: "紅心芭樂茉綠奶蓋雪糕", img: "image/8.png", score: 0, review: "紅心芭樂讚🍀🍀🍀 超讚！！！！" },
      { name: "牧場直送4.0玉米牛奶雪糕", img: "image/9.png", score: 0, review: "None" },
      { name: "丸永製菓檸檬蛋糕風味冰棒", img: "image/10.png", score: 0, review: "好吃～但蠻甜的😳 而且很小😂" },
      { name: "牧場直送4.0草莓牛奶雪糕", img: "image/11.png", score: 4.3, review: "牧場系列我覺得草莓很好吃" },
      { name: "紫薯香草風味奶蓋雪糕", img: "image/12.png", score: 4.1, review: "香香甜甜 裡面的地瓜圓意外的加分" }
    ];

    function analyzeImageHue(imgUrl) {
      return new Promise((resolve) => {
        const img = new Image();
        img.crossOrigin = "Anonymous";
        img.src = imgUrl;

        img.onload = () => {
          const canvas = document.createElement("canvas");
          const ctx = canvas.getContext("2d");
          canvas.width = 40;
          canvas.height = 40;

          ctx.drawImage(img, 0, 0, 40, 40);
          try {
            const data = ctx.getImageData(0, 0, 40, 40).data;
            let rSum = 0, gSum = 0, bSum = 0, count = 0;

            for (let i = 0; i < data.length; i += 4) {
              const alpha = data[i + 3];
              if (alpha > 30) {
                rSum += data[i];
                gSum += data[i + 1];
                bSum += data[i + 2];
                count++;
              }
            }

            if (count === 0) return resolve(0);

            const r = rSum / count / 255;
            const g = gSum / count / 255;
            const b = bSum / count / 255;

            const max = Math.max(r, g, b), min = Math.min(r, g, b);
            let h = 0;

            if (max !== min) {
              const d = max - min;
              switch (max) {
                case r: h = (g - b) / d + (g < b ? 6 : 0); break;
                case g: h = (b - r) / d + 2; break;
                case b: h = (r - g) / d + 4; break;
              }
              h /= 6;
            }
            resolve(Math.round(h * 360));
          } catch (e) {
            resolve(0);
          }
        };

        img.onerror = () => resolve(0);
      });
    }

    const carousel = document.getElementById("carousel");
    const stage = document.getElementById("stage");
    const gallery = document.getElementById("thumbnailGallery");
    const iceTitleEl = document.getElementById("iceTitle");
    const starsInnerEl = document.getElementById("starsInner");
    const scoreNumEl = document.getElementById("scoreNum");
    const reviewTextEl = document.getElementById("reviewText");

    let total, angleStep, radius, cards;
    let currentAngle = 0, startX = 0, isDragging = false, velocity = 0, lastX = 0, animationFrame = null;

    async function initCarousel() {
      for (let item of popsicles) {
        item.hue = await analyzeImageHue(item.img);
      }

      popsicles.sort((a, b) => a.hue - b.hue);

      carousel.innerHTML = "";
      gallery.innerHTML = "";
      total = popsicles.length;
      angleStep = 360 / total;

      // 📱 依據螢幕寬度自動選擇卡片尺寸（手機端適度縮小）
      const isMobile = window.innerWidth <= 480;
      const cardWidth = isMobile ? 160 : 225;
      const cardHeight = isMobile ? 213 : 300;

      document.documentElement.style.setProperty('--card-w', `${cardWidth}px`);
      document.documentElement.style.setProperty('--card-h', `${cardHeight}px`);

      const computedRadius = Math.round((cardWidth / 2) / Math.tan(Math.PI / total)) + (isMobile ? 10 : 20);
      radius = Math.max(isMobile ? 200 : 280, computedRadius);

      popsicles.forEach((item, index) => {
        const card = document.createElement("div");
        card.className = "card";
        const cardAngle = angleStep * index;
        card.style.transform = `rotateY(${cardAngle}deg) translateZ(${radius}px)`;
        card.innerHTML = `<img src="${item.img}" alt="${item.name}">`;
        carousel.appendChild(card);

        const thumb = document.createElement("div");
        thumb.className = "thumb-card";
        thumb.innerHTML = `<img src="${item.img}" alt="${item.name}">`;
        
        thumb.onclick = () => {
          let targetAngle = -index * angleStep;
          let diff = (targetAngle - currentAngle) % 360;
          if (diff > 180) diff -= 360;
          if (diff < -180) diff += 360;
          
          cancelAnimationFrame(animationFrame);
          animateSnap(currentAngle + diff);
          
          window.scrollTo({ top: 0, behavior: 'smooth' });
        };
        gallery.appendChild(thumb);
      });

      cards = document.querySelectorAll(".card");
      render();
    }

    function updateActiveCard() {
      if (!cards || cards.length === 0) return;
      let normalizedAngle = (-currentAngle % 360 + 360) % 360;
      let activeIndex = Math.round(normalizedAngle / angleStep) % total;

      cards.forEach((card, idx) => {
        card.classList.toggle("active", idx === activeIndex);
      });

      const currentScore = popsicles[activeIndex].score;
      iceTitleEl.textContent = popsicles[activeIndex].name;
      starsInnerEl.style.width = `${(currentScore / 5.0) * 100}%`;
      scoreNumEl.textContent = `(${currentScore.toFixed(1)} / 5.0)`;
      reviewTextEl.textContent = popsicles[activeIndex].review;
    }

    function render() {
      carousel.style.transform = `rotateY(${currentAngle}deg)`;
      updateActiveCard();
    }

    function onPointerDown(e) {
      isDragging = true;
      startX = e.clientX || (e.touches && e.touches[0].clientX);
      lastX = startX;
      velocity = 0;
      cancelAnimationFrame(animationFrame);
    }

    function onPointerMove(e) {
      if (!isDragging) return;
      const x = e.clientX || (e.touches && e.touches[0].clientX);
      const deltaX = x - lastX;
      currentAngle += deltaX * 0.35;
      velocity = deltaX * 0.35;
      lastX = x;
      render();
    }

    function onPointerUp() {
      if (!isDragging) return;
      isDragging = false;
      applyInertia();
    }

    function applyInertia() {
      if (Math.abs(velocity) > 0.05) {
        currentAngle += velocity;
        velocity *= 0.93;
        render();
        animationFrame = requestAnimationFrame(applyInertia);
      } else {
        snapToNearest();
      }
    }

    function animateSnap(target) {
      const diff = target - currentAngle;
      if (Math.abs(diff) > 0.1) {
        currentAngle += diff * 0.1;
        render();
        animationFrame = requestAnimationFrame(() => animateSnap(target));
      } else {
        currentAngle = target;
        render();
      }
    }

    function snapToNearest() {
      const targetAngle = Math.round(currentAngle / angleStep) * angleStep;
      animateSnap(targetAngle);
    }

    // 觸控與滑鼠事件處理
    stage.addEventListener("mousedown", onPointerDown);
    window.addEventListener("mousemove", onPointerMove);
    window.addEventListener("mouseup", onPointerUp);

    stage.addEventListener("touchstart", onPointerDown, { passive: true });
    window.addEventListener("touchmove", onPointerMove, { passive: true });
    window.addEventListener("touchend", onPointerUp);

    // 螢幕旋轉/調整尺寸時重新適應
    window.addEventListener("resize", () => {
      clearTimeout(window.resizeTimer);
      window.resizeTimer = setTimeout(initCarousel, 250);
    });

    initCarousel();
  </script>
</body>
</html>
