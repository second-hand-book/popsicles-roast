<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>POPSICLE ROAST</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background-color: #ffffff;
      color: #111111;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", "Helvetica Neue", Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      overflow-x: hidden;
    }

    .hero-section {
      width: 100%;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
      padding-bottom: 2rem;
    }

    header {
      text-align: center;
      padding-top: 3.5rem;
      width: 100%;
    }

    header h1 {
      font-size: 3.8rem;
      letter-spacing: 12px;
      font-weight: 800;
      color: #111111;
      text-transform: uppercase;
      line-height: 1;
    }

    .stage {
      width: 100%;
      height: 380px;
      perspective: 1000px;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: grab;
    }

    .stage:active {
      cursor: grabbing;
    }

    .carousel {
      width: 225px;
      height: 300px;
      position: relative;
      transform-style: preserve-3d;
    }

    .card {
      position: absolute;
      width: 225px;
      height: 300px;
      border-radius: 0;
      overflow: visible;
      background: transparent;
      transition: opacity 0.3s, transform 0.3s;
      opacity: 0.15;
    }

    .card img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      pointer-events: none;
      background-color: transparent;
      filter: drop-shadow(0 8px 16px rgba(0, 0, 0, 0.12));
    }

    .card.active {
      opacity: 1;
    }

    .card.active img {
      filter: drop-shadow(0 12px 24px rgba(0, 0, 0, 0.2));
    }

    .review-panel {
      width: 90%;
      max-width: 500px;
      padding: 1rem;
      text-align: center;
      min-height: 140px;
    }

    .ice-title {
      font-size: 1.3rem;
      font-weight: 700;
      color: #111111;
      margin-bottom: 0.6rem;
      letter-spacing: 1px;
    }

    .rating-container {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-bottom: 0.8rem;
    }

    .stars-outer {
      position: relative;
      display: inline-block;
      font-size: 1.2rem;
      letter-spacing: 3px;
      color: #e2e8f0;
      line-height: 1;
    }

    .stars-inner {
      position: absolute;
      top: 0;
      left: 0;
      white-space: nowrap;
      overflow: hidden;
      color: #111111;
      line-height: 1;
    }

    .score-num {
      font-size: 1.05rem;
      color: #111111;
      font-weight: 600;
      letter-spacing: 1px;
      margin-left: 4px;
    }

    .review-text {
      color: #333333;
      font-size: 0.95rem;
      line-height: 1.6;
      font-weight: 400;
    }

    .gallery-section {
      width: 100%;
      max-width: 800px;
      margin-top: 15vh;
      padding: 0 1.5rem 6rem 1.5rem;
      text-align: center;
    }

    .gallery-title {
      font-size: 0.9rem;
      letter-spacing: 4px;
      font-weight: 700;
      color: #888888;
      text-transform: uppercase;
      margin-bottom: 2rem;
    }

    .thumbnail-gallery {
      width: 100%;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(65px, 1fr));
      gap: 14px;
    }

    .thumb-card {
      aspect-ratio: 3/4;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 6px;
      background-color: transparent; /* 純透明背景 */
      transition: transform 0.25s cubic-bezier(0.2, 0, 0, 1);
    }

    .thumb-card:hover {
      transform: scale(1.18) translateY(-4px);
      z-index: 10;
    }

    .thumb-card img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 4px 6px rgba(0, 0, 0, 0.08));
    }
  </style>
</head>
<body>

  <div class="hero-section">
    <header>
      <h1>POPSICLE ROAST</h1>
    </header>

    <div class="stage" id="stage">
      <div class="carousel" id="carousel"></div>
    </div>

    <div class="review-panel">
      <div class="ice-title" id="iceTitle"></div>
      
      <div class="rating-container">
        <div class="stars-outer">
          ★★★★★
          <div class="stars-inner" id="starsInner">★★★★★</div>
        </div>
        <span class="score-num" id="scoreNum"></span>
      </div>

      <div class="review-text" id="reviewText"></div>
    </div>
  </div>

  <div class="gallery-section">
    <div class="gallery-title">ALL POPSICLES</div>
    <div class="thumbnail-gallery" id="thumbnailGallery"></div>
  </div>

  <script>
    let popsicles = [
      { name: "白醋涼麵風味雪糕", img: "image/1.png", score: 1.2, review: "這太鹹了…吃一整支舌頭會澀" },
      { name: "開心果金絲脆摩納餅", img: "image/2.png", score: 0.5, review: "不！！！不好吃！沒什麼開心果味 裡面也不算脆 大家不要買！" },
      { name: "Baiocchi", img: "image/3.png", score: 4.8, review: "開心果推薦這個餅乾" },
      { name: "番茄糖葫蘆冰棒", img: "image/4.png", score: 4.3, review: "好吃到想囤積XD" },
      { name: "JULIA LIN 香菜牛奶花生雪糕", img: "image/5.png", score: 2.3, review: "雅芳加新鮮香菜在冰棒裡真的有合法嗎？" },
      { name: "莊記綠豆鑽冰棒", img: "image/6.png", score: 4.3, review: "好吃欸" },
      { name: "極濃義式開心果雪糕", img: "image/7.png", score: 0, review: "None" },
      { name: "紅心芭樂茉綠奶蓋雪糕", img: "image/8.png", score: 0, review: "紅心芭樂讚🍀🍀🍀 超讚！！！！" },
      { name: "牧場直送4.0玉米牛奶雪糕", img: "image/9.png", score: 0, review: "None" },
      { name: "丸永製菓檸檬蛋糕風味冰棒", img: "image/10.png", score: 0, review: "好吃～但蠻甜的😳 而且很小😂" },
      { name: "牧場直送4.0草莓牛奶雪糕", img: "image/11.png", score: 4.3, review: "牧場系列我覺得草莓很好吃" },
      { name: "紫薯香草風味奶蓋雪糕", img: "image/12.png", score: 4.1, review: "香香甜甜 裡面的地瓜圓意外的加分 是軟的（牙齒友善" }
    ];

    // 自動分析圖片主色調與色相 (Hue)
    function analyzeImageHue(imgUrl) {
      return new Promise((resolve) => {
        const img = new Image();
        img.crossOrigin = "Anonymous";
        img.src = imgUrl;

        img.onload = () => {
          const canvas = document.createElement("canvas");
          const ctx = canvas.getContext("2d");
          canvas.width = 40;
          canvas.height = 40;

          ctx.drawImage(img, 0, 0, 40, 40);
          try {
            const data = ctx.getImageData(0, 0, 40, 40).data;
            let rSum = 0, gSum = 0, bSum = 0, count = 0;

            for (let i = 0; i < data.length; i += 4) {
              const alpha = data[i + 3];
              if (alpha > 30) {
                rSum += data[i];
                gSum += data[i + 1];
                bSum += data[i + 2];
                count++;
              }
            }

            if (count === 0) return resolve(0);

            const r = rSum / count / 255;
            const g = gSum / count / 255;
            const b = bSum / count / 255;

            const max = Math.max(r, g, b), min = Math.min(r, g, b);
            let h = 0;

            if (max !== min) {
              const d = max - min;
              switch (max) {
                case r: h = (g - b) / d + (g < b ? 6 : 0); break;
                case g: h = (b - r) / d + 2; break;
                case b: h = (r - g) / d + 4; break;
              }
              h /= 6;
            }
            resolve(Math.round(h * 360));
          } catch (e) {
            resolve(0);
          }
        };

        img.onerror = () => resolve(0);
      });
    }

    const carousel = document.getElementById("carousel");
    const stage = document.getElementById("stage");
    const gallery = document.getElementById("thumbnailGallery");
    const iceTitleEl = document.getElementById("iceTitle");
    const starsInnerEl = document.getElementById("starsInner");
    const scoreNumEl = document.getElementById("scoreNum");
    const reviewTextEl = document.getElementById("reviewText");

    let total, angleStep, radius, cards;
    let currentAngle = 0, startX = 0, isDragging = false, velocity = 0, lastX = 0, animationFrame = null;

    async function initCarousel() {
      // 1. 自動分析並寫入 hue 值
      for (let item of popsicles) {
        item.hue = await analyzeImageHue(item.img);
      }

      // 2. 依顏色色相 (Hue: 0°~360°) 完全自動由小到大排序
      popsicles.sort((a, b) => a.hue - b.hue);

      carousel.innerHTML = "";
      gallery.innerHTML = "";
      total = popsicles.length;
      angleStep = 360 / total;

      const cardWidth = 225;
      const computedRadius = Math.round((cardWidth / 2) / Math.tan(Math.PI / total)) + 20;
      radius = Math.max(280, computedRadius);

      popsicles.forEach((item, index) => {
        // 渲染 3D 轉盤卡片
        const card = document.createElement("div");
        card.className = "card";
        const cardAngle = angleStep * index;
        card.style.transform = `rotateY(${cardAngle}deg) translateZ(${radius}px)`;
        card.innerHTML = `<img src="${item.img}" alt="${item.name}">`;
        carousel.appendChild(card);

        // 渲染縮圖牆 (背景保持全透明)
        const thumb = document.createElement("div");
        thumb.className = "thumb-card";
        thumb.innerHTML = `<img src="${item.img}" alt="${item.name}">`;
        
        thumb.onclick = () => {
          let targetAngle = -index * angleStep;
          let diff = (targetAngle - currentAngle) % 360;
          if (diff > 180) diff -= 360;
          if (diff < -180) diff += 360;
          
          cancelAnimationFrame(animationFrame);
          animateSnap(currentAngle + diff);
          
          window.scrollTo({ top: 0, behavior: 'smooth' });
        };
        gallery.appendChild(thumb);
      });

      cards = document.querySelectorAll(".card");
      render();
    }

    function updateActiveCard() {
      if (!cards || cards.length === 0) return;
      let normalizedAngle = (-currentAngle % 360 + 360) % 360;
      let activeIndex = Math.round(normalizedAngle / angleStep) % total;

      cards.forEach((card, idx) => {
        card.classList.toggle("active", idx === activeIndex);
      });

      const currentScore = popsicles[activeIndex].score;
      iceTitleEl.textContent = popsicles[activeIndex].name;
      starsInnerEl.style.width = `${(currentScore / 5.0) * 100}%`;
      scoreNumEl.textContent = `(${currentScore.toFixed(1)} / 5.0)`;
      reviewTextEl.textContent = popsicles[activeIndex].review;
    }

    function render() {
      carousel.style.transform = `rotateY(${currentAngle}deg)`;
      updateActiveCard();
    }

    function onPointerDown(e) {
      isDragging = true;
      startX = e.clientX || e.touches[0].clientX;
      lastX = startX;
      velocity = 0;
      cancelAnimationFrame(animationFrame);
    }

    function onPointerMove(e) {
      if (!isDragging) return;
      const x = e.clientX || (e.touches && e.touches[0].clientX);
      const deltaX = x - lastX;
      currentAngle += deltaX * 0.3;
      velocity = deltaX * 0.3;
      lastX = x;
      render();
    }

    function onPointerUp() {
      if (!isDragging) return;
      isDragging = false;
      applyInertia();
    }

    function applyInertia() {
      if (Math.abs(velocity) > 0.05) {
        currentAngle += velocity;
        velocity *= 0.93;
        render();
        animationFrame = requestAnimationFrame(applyInertia);
      } else {
        snapToNearest();
      }
    }

    function animateSnap(target) {
      const diff = target - currentAngle;
      if (Math.abs(diff) > 0.1) {
        currentAngle += diff * 0.1;
        render();
        animationFrame = requestAnimationFrame(() => animateSnap(target));
      } else {
        currentAngle = target;
        render();
      }
    }

    function snapToNearest() {
      const targetAngle = Math.round(currentAngle / angleStep) * angleStep;
      animateSnap(targetAngle);
    }

    stage.addEventListener("mousedown", onPointerDown);
    window.addEventListener("mousemove", onPointerMove);
    window.addEventListener("mouseup", onPointerUp);
    stage.addEventListener("touchstart", onPointerDown);
    window.addEventListener("touchmove", onPointerMove);
    window.addEventListener("touchend", onPointerUp);

    initCarousel();
  </script>
</body>
</html>
